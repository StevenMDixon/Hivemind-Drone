# Global mpv options for every station (MPV_HOME=/config/mpv).
# Per-station options belong in "mpvArgs" in /config/settings.json.

# Wayland output (DISPLAY_BACKEND=sway). For DISPLAY_BACKEND=drm the
# per-station mpvArgs override this with --gpu-context=drm.
vo=gpu
gpu-context=wayland

# Hardware decoding through VA-API (/dev/dri/renderD*) when available.
hwdec=auto-safe

# Linux audio goes straight to ALSA (no PulseAudio/PipeWire in the container).
ao=alsa

# Kiosk behaviour: no on-screen controller, no cursor, no terminal input.
osc=no
cursor-autohide=always
input-terminal=no
